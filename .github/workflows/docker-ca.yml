name: Docker certificate smoke tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'global.json'
      - 'Directory.*.props'
      - 'src/**/Directory.Build.props'
      - 'scripts/test-ca-trust.sh'
      - 'test/TlsSmoke/**'
      - '.github/workflows/docker-ca.yml'
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'global.json'
      - 'Directory.*.props'
      - 'src/**/Directory.Build.props'
      - 'scripts/test-ca-trust.sh'
      - 'test/TlsSmoke/**'
      - '.github/workflows/docker-ca.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: ["10.0", "11.0"]
        image:
          - name: elsa-server
            dockerfile: docker/ElsaServer.Dockerfile
            tag: elsa-server-smoke
            skip_otel: '0'
          - name: elsa-server-datadog
            dockerfile: docker/ElsaServer-Datadog.Dockerfile
            tag: elsa-server-datadog-smoke
            skip_otel: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Publish TLS smoke test app
        run: dotnet publish test/TlsSmoke/TlsSmoke.csproj -c Release --framework net${{ matrix.runtime }} -o artifacts/tls-smoke

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }} image
        run: docker build -f ${{ matrix.image.dockerfile }} --build-arg DOTNET_RUNTIME_VERSION=${{ matrix.runtime }} -t ${{ matrix.image.tag }} .

      - name: Run TLS smoke tests
        env:
          SKIP_OTEL: ${{ matrix.image.skip_otel }}
        run: |
          set -euo pipefail
          TLS_APP_DIR="${{ github.workspace }}/artifacts/tls-smoke"
          if [ "$SKIP_OTEL" = "1" ]; then
            scripts/test-ca-trust.sh "${{ matrix.image.tag }}" "$TLS_APP_DIR" -e ELSA_SKIP_OTEL_AUTO=1
          else
            scripts/test-ca-trust.sh "${{ matrix.image.tag }}" "$TLS_APP_DIR"
          fi
