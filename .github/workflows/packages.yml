name: Packages

on:
  workflow_dispatch:
    inputs:
      build_packages:
        description: 'Build and upload NuGet packages alongside coverage validation'
        type: boolean
        default: true
  push:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  # Explicit manual validations remain independent of automatic main pushes.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  base_version: '3.9.0'

jobs:
  test_unit_integration:
    name: Test unit/integration with coverage (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Show .NET info
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-nuget
        with:
          workload: unit-integration

      - name: Restore unit and integration tests
        run: dotnet restore Elsa.UnitIntegration.Tests.slnf --locked-mode --ignore-failed-sources

      - name: Prepare test results directory
        run: |
          rm -rf artifacts/test-results/unit-integration
          mkdir -p artifacts/test-results/unit-integration

      - name: Run unit and integration tests with coverage
        run: |
          set -euo pipefail
          dotnet test --solution Elsa.UnitIntegration.Tests.slnf \
            --framework ${{ matrix.framework }} \
            --configuration Release \
            --no-restore \
            --results-directory artifacts/test-results/unit-integration \
            -- \
            --coverage \
            --coverage-settings "$GITHUB_WORKSPACE/test/coverage.settings.xml" \
            --coverage-output-format cobertura \
            --report-trx

          coverage_count=$(find artifacts/test-results/unit-integration -maxdepth 1 -type f -name '*.cobertura.xml' | wc -l | tr -d ' ')
          expected_coverage_count=$(python3 -c 'import json; print(len(json.load(open("Elsa.UnitIntegration.Tests.slnf"))["solution"]["projects"]))')
          if [[ "$coverage_count" != "$expected_coverage_count" ]]; then
            echo "Expected $expected_coverage_count unit/integration coverage files, found $coverage_count." >&2
            exit 1
          fi

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Docker logs ==="
          for container in $(docker ps -aq); do
            echo "--- Logs for container $container ---"
            docker logs "$container" 2>&1 | tail -100 || true
          done

      - name: Upload unit and integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-integration-test-results-${{ matrix.framework }}
          path: artifacts/test-results/unit-integration

  test_component:
    name: Test component with coverage (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Show .NET info
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-nuget
        with:
          workload: component

      - name: Restore component tests
        run: dotnet restore Elsa.Component.Tests.slnf --locked-mode --ignore-failed-sources

      - name: Prepare test results directory
        run: |
          rm -rf artifacts/test-results/component
          mkdir -p artifacts/test-results/component

      - name: Run component tests with coverage and hang diagnostics
        run: |
          set -euo pipefail
          dotnet test --solution Elsa.Component.Tests.slnf \
            --framework ${{ matrix.framework }} \
            --configuration Release \
            --no-restore \
            --results-directory artifacts/test-results/component \
            -- \
            --coverage \
            --coverage-settings "$GITHUB_WORKSPACE/test/coverage.settings.xml" \
            --coverage-output-format cobertura \
            --report-trx \
            --hangdump \
            --hangdump-timeout 5m \
            --hangdump-type Mini

          coverage_count=$(find artifacts/test-results/component -maxdepth 1 -type f -name '*.cobertura.xml' | wc -l | tr -d ' ')
          if [[ "$coverage_count" != "1" ]]; then
            echo "Expected one component coverage file, found $coverage_count." >&2
            exit 1
          fi

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Docker logs ==="
          for container in $(docker ps -aq); do
            echo "--- Logs for container $container ---"
            docker logs "$container" 2>&1 | tail -100 || true
          done

      - name: Upload component test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: component-test-results-${{ matrix.framework }}
          path: artifacts/test-results/component

  coverage_report:
    name: Generate coverage report
    needs:
      - test_unit_integration
      - test_component
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && !cancelled() && needs.test_unit_integration.result == 'success' && needs.test_component.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Download unit and integration test results
        uses: actions/download-artifact@v8
        with:
          pattern: unit-integration-test-results-*
          path: artifacts/test-results/unit-integration

      - name: Download component test results
        uses: actions/download-artifact@v8
        with:
          pattern: component-test-results-*
          path: artifacts/test-results/component

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-nuget
        with:
          workload: tools

      - name: Restore .NET tools
        run: dotnet tool restore --tool-manifest .config/dotnet-tools.json

      - name: Generate HTML coverage report
        run: |
          dotnet tool run reportgenerator \
            "-reports:./artifacts/test-results/**/*.cobertura.xml" \
            "-targetdir:./artifacts/coverage-report" \
            "-reporttypes:Html;Cobertura;TextSummary" \
            "--minimumCoverageThresholds:lineCoverage=10" \
            "-verbosity:Info"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: artifacts/coverage-report

  build:
    name: Build packages
    if: github.event_name != 'workflow_dispatch' || inputs.build_packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build artifacts alongside tests; the workflow still requires every validation job.
    steps:
      - name: Reclaim hosted runner disk space
        shell: bash
        run: |
          df -h /
          # These preinstalled toolchains are unused by the .NET build and tests.
          sudo rm -rf -- /usr/local/lib/android /usr/local/.ghcup /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VERSION variable
        run: echo "VERSION=${{ env.base_version }}-preview.${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-nuget
        with:
          workload: solution

      - name: Restore
        run: dotnet restore Elsa.slnx --locked-mode -p:Version="$VERSION"

      - name: Build
        run: dotnet build Elsa.slnx --configuration Release --no-restore -p:Version="$VERSION"

      - name: Pack
        run: dotnet pack Elsa.slnx --configuration Release --no-build --no-restore --output packages -p:Version="$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: elsa-nuget-packages
          path: packages/*nupkg
          if-no-files-found: error
