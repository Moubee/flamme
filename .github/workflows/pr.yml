name: pr

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - 'patch/*'
      - 'develop/*'
      - 'release/*'
    paths:
      - '**/*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_dotnet: ${{ steps.classify.outputs.run_dotnet }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          # PR checkout selects the synthetic merge commit and its two parents.
          fetch-depth: 2
      - name: Decide whether .NET validation is needed
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run_dotnet=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # Compare the merged result with its base, including deletions on moves.
            # Write the diff first so a git failure cannot become a successful skip.
            git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/pr-changed-paths"
            has_changes=false
            run_dotnet=false
            while IFS= read -r -d '' path; do
              has_changes=true
              case "$path" in
                design/video/elsa-readme-video/*) ;;
                *) run_dotnet=true; break ;;
              esac
            done < "$RUNNER_TEMP/pr-changed-paths"
            # An empty diff is not evidence that this is a design-only change.
            if [[ "$has_changes" == false ]]; then
              run_dotnet=true
            fi
          fi
          echo "run_dotnet=$run_dotnet" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.framework }})
    needs: changes
    if: needs.changes.outputs.run_dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    steps:
      - name: Reclaim hosted runner disk space
        if: matrix.framework == 'net10.0'
        shell: bash
        run: |
          df -h /
          # These preinstalled toolchains are unused by the .NET build and tests.
          sudo rm -rf -- /usr/local/lib/android /usr/local/.ghcup /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          # Install the .NET 10 runtime alongside SDK 11 to test both supported targets.
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-nuget
        with:
          workload: ${{ matrix.framework == 'net10.0' && 'solution' || 'correctness' }}

      # One lane still validates every project and target, including the net10-only benchmarks.
      - name: 'Run: Restore solution'
        if: matrix.framework == 'net10.0'
        run: dotnet restore Elsa.slnx --locked-mode
      - name: 'Run: Build solution'
        if: matrix.framework == 'net10.0'
        run: dotnet build Elsa.slnx --configuration Release --no-restore
      - name: 'Run: Test .NET 10'
        if: matrix.framework == 'net10.0'
        run: dotnet test --solution Elsa.slnx --framework net10.0 --configuration Release --no-build

      # Locks describe both frameworks, while this lane only compiles and runs net11.
      - name: 'Run: Restore .NET 11 tests'
        if: matrix.framework == 'net11.0'
        run: |
          dotnet restore Elsa.UnitIntegration.Tests.slnf --locked-mode
          dotnet restore Elsa.Component.Tests.slnf --locked-mode
      - name: 'Run: Test .NET 11'
        if: matrix.framework == 'net11.0'
        run: |
          dotnet test --solution Elsa.UnitIntegration.Tests.slnf --framework net11.0 --configuration Release --no-restore
          dotnet test --solution Elsa.Component.Tests.slnf --framework net11.0 --configuration Release --no-restore

  ubuntu-latest:
    # Preserve the existing required check, including deliberate design-only skips.
    name: ubuntu-latest
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require validation or an explicit design-only decision
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          RUN_DOTNET: ${{ needs.changes.outputs.run_dotnet }}
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGE_RESULT" = success
          case "$RUN_DOTNET" in
            true) test "$TEST_RESULT" = success ;;
            false) test "$TEST_RESULT" = skipped ;;
            *) echo "Missing or invalid .NET validation decision." >&2; exit 1 ;;
          esac
