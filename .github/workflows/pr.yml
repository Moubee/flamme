name: pr

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - 'patch/*'
      - 'develop/*'
      - 'release/*'
    paths:
      - '**/*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    steps:
      - name: Reclaim hosted runner disk space
        if: matrix.framework == 'net10.0'
        shell: bash
        run: |
          df -h /
          # These preinstalled toolchains are unused by the .NET build and tests.
          sudo rm -rf -- /usr/local/lib/android /usr/local/.ghcup /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          # Install the .NET 10 runtime alongside SDK 11 to test both supported targets.
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-nuget
        with:
          workload: ${{ matrix.framework == 'net10.0' && 'solution' || 'correctness' }}

      # One lane still validates every project and target, including the net10-only benchmarks.
      - name: 'Run: Restore solution'
        if: matrix.framework == 'net10.0'
        run: dotnet restore Flamme.slnx --locked-mode
      - name: 'Run: Build solution'
        if: matrix.framework == 'net10.0'
        run: dotnet build Flamme.slnx --configuration Release --no-restore
      - name: 'Run: Test .NET 10'
        if: matrix.framework == 'net10.0'
        run: dotnet test --solution Flamme.slnx --framework net10.0 --configuration Release --no-build
      - name: Verify packaged producer workflows on PostgreSQL
        if: matrix.framework == 'net10.0'
        shell: bash
        run: |
          export FLAMME_FEED="$RUNNER_TEMP/flamme-feed"
          dotnet pack Flamme.slnx -c Release --no-build --no-restore -o "$FLAMME_FEED"
          cp -R samples/PublishedActivities "$RUNNER_TEMP/consumer"
          cp global.json "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          export NUGET_PACKAGES="$RUNNER_TEMP/consumer-cache"
          dotnet restore --configfile NuGet.Config -p:FlammeVersion=1.0.0
          dotnet build -c Release --no-restore -p:FlammeVersion=1.0.0
          container=$(docker run -d --rm -p 127.0.0.1::5432 -e POSTGRES_PASSWORD=sample postgres:17-alpine)
          trap 'docker stop "$container" > /dev/null' EXIT
          for attempt in {1..30}; do
            docker exec "$container" pg_isready -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          address=$(docker port "$container" 5432/tcp)
          export FLAMME_SAMPLE_DB="Host=127.0.0.1;Port=${address##*:};Database=postgres;Username=postgres;Password=sample"
          python3 verify.py bin/Release/net10.0/PublishedActivities.dll
          python3 verify.py bin/Release/net11.0/PublishedActivities.dll

      # Locks describe both frameworks, while this lane only compiles and runs net11.
      - name: 'Run: Restore .NET 11 tests'
        if: matrix.framework == 'net11.0'
        run: |
          dotnet restore Flamme.UnitIntegration.Tests.slnf --locked-mode
          dotnet restore Flamme.Component.Tests.slnf --locked-mode
      - name: 'Run: Test .NET 11'
        if: matrix.framework == 'net11.0'
        run: |
          dotnet test --solution Flamme.UnitIntegration.Tests.slnf --framework net11.0 --configuration Release --no-restore
          dotnet test --solution Flamme.Component.Tests.slnf --framework net11.0 --configuration Release --no-restore

  ubuntu-latest:
    # Preserve the required check configured in the main branch ruleset.
    name: ubuntu-latest
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require .NET validation
        env:
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: test "$TEST_RESULT" = success
