name: pr

on:
  pull_request:
    branches:
      - main
      - 'patch/*'
      - 'develop/*'
      - 'release/*'
    paths:
      - '**/*'

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim hosted runner disk space
        shell: bash
        run: |
          df -h /
          # These preinstalled toolchains are unused by the .NET build and tests.
          sudo rm -rf -- /usr/local/lib/android /usr/local/.ghcup /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # Test applications target .NET 10 and need its runtime alongside SDK 11.
          dotnet-version: 10.0.x
      - name: 'Run: Restore'
        run: dotnet restore Elsa.sln
      - name: 'Run: Build'
        run: dotnet build Elsa.sln --configuration Release --no-restore
      - name: 'Run: Test'
        run: dotnet test --solution Elsa.sln --configuration Release --no-build
