version: 2
# Cooldown applies to version updates; security updates bypass the release delay.
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    # Keep major upgrades individually reviewable; group compatible release levels.
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "Azure.*"
          - "NuGet.*"
          - "Yarp.ReverseProxy"
          - "System.CommandLine"
          - "System.Formats.Asn1"
          - "System.Net.Http"
          - "System.Text.Json"
          - "System.Text.RegularExpressions"
        update-types: ["minor", "patch"]
      bpmn:
        patterns: ["Bpmn.*"]
        update-types: ["minor", "patch"]
      consolelogstreaming:
        patterns: ["ConsoleLogStreaming.*"]
        update-types: ["minor", "patch"]
      cshells:
        patterns: ["CShells", "CShells.*"]
        update-types: ["minor", "patch"]
      distributedlock:
        patterns: ["DistributedLock", "DistributedLock.*"]
        update-types: ["minor", "patch"]
      fastendpoints:
        patterns: ["FastEndpoints", "FastEndpoints.*"]
        update-types: ["minor", "patch"]
      fluentstorage:
        patterns: ["FluentStorage", "FluentStorage.*"]
        update-types: ["minor", "patch"]
      fody:
        patterns: ["Fody", "ConfigureAwait.Fody"]
        update-types: ["minor", "patch"]
      loom:
        patterns: ["Loom", "Loom.*"]
        update-types: ["minor", "patch"]
      masstransit:
        patterns: ["MassTransit", "MassTransit.*"]
        update-types: ["minor", "patch"]
      npgsql:
        patterns: ["Npgsql", "Npgsql.*"]
        update-types: ["minor", "patch"]
      nuplane:
        patterns: ["Nuplane", "Nuplane.*"]
        update-types: ["minor", "patch"]
      opentelemetry:
        patterns: ["OpenTelemetry", "OpenTelemetry.*"]
        update-types: ["minor", "patch"]
      polly:
        patterns: ["Polly", "Polly.*"]
        update-types: ["minor", "patch"]
      refit:
        patterns: ["Refit", "Refit.*"]
        update-types: ["minor", "patch"]
      serilog:
        patterns: ["Serilog", "Serilog.*"]
        update-types: ["minor", "patch"]
      testcontainers:
        patterns: ["Testcontainers", "Testcontainers.*"]
        update-types: ["minor", "patch"]
      tunit:
        patterns: ["TUnit", "TUnit.*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/cache-nuget"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github:
        patterns: ["actions/*"]
        update-types: ["minor", "patch"]
      docker:
        patterns: ["docker/*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories:
      - "/src/modules/Elsa.Expressions.JavaScript.Libraries/ClientLib"
      - "/design/video/elsa-readme-video"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      webpack:
        patterns: ["webpack", "webpack-cli", "terser-webpack-plugin"]
        update-types: ["minor", "patch"]
      remotion:
        patterns: ["remotion", "@remotion/*"]
        update-types: ["minor", "patch"]
      react:
        patterns: ["react", "react-dom"]
        update-types: ["minor", "patch"]
      react-types:
        patterns: ["@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
