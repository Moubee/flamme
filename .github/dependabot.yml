version: 2
# Cooldown applies to version updates; security updates bypass the release delay.
# NuGet version scans are disabled: the shared restore graph requires Feedz.
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/cache-nuget"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github:
        patterns: ["actions/*"]
        update-types: ["minor", "patch"]
      docker:
        patterns: ["docker/*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories:
      - "/src/modules/Elsa.Expressions.JavaScript.Libraries/ClientLib"
      - "/design/video/elsa-readme-video"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      webpack:
        patterns: ["webpack", "webpack-cli", "terser-webpack-plugin"]
        update-types: ["minor", "patch"]
      remotion:
        patterns: ["remotion", "@remotion/*"]
        update-types: ["minor", "patch"]
      react:
        patterns: ["react", "react-dom"]
        update-types: ["minor", "patch"]
      react-types:
        patterns: ["@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
