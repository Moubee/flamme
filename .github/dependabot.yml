version: 2
# Cooldown applies to version updates; security updates bypass the release delay.
# NuGet version scans remain disabled; NuGet updates are maintained manually.
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/cache-nuget"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github:
        patterns: ["actions/*"]
        update-types: ["minor", "patch"]
      docker:
        patterns: ["docker/*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories:
      - "/src/modules/Elsa.Expressions.JavaScript.Libraries/ClientLib"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      webpack:
        patterns: ["webpack", "webpack-cli", "terser-webpack-plugin"]
        update-types: ["minor", "patch"]
